label{display:block; font-size:13px; font-weight:700; margin-bottom:4px}

}, {"a": "a01", "c": "c17"}, {"a": "a01", "c": "c18"}], "mostrarRanking": false};
var CFG = window.TABLERO_CONFIG || {};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');}
function hoy(){var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fFecha(s){if(!s)return 'Sin fecha'; var p=s.split('-'); var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0];}
function icono(name,size,stroke){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+(stroke||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONOS[name]||ICONOS.estrella)+'</svg>';}

/* ---------- Lectura de la planilla ---------- */
function parseCSV(t){
  var rows=[], row=[], f='', q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"'; i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f); f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f); rows.push(row);}
  if(!rows.length) return [];
  var head=rows[0].map(norm);
  return rows.slice(1).filter(function(r){return r.some(function(x){return String(x).trim();});}).map(function(r){var o={}; head.forEach(function(h,i){o[h]=(r[i]||'').trim();}); return o;});
}
function fechaISO(v){
  v=String(v||'').trim(); if(!v) return '';
  var m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m){var y=m[3].length===2?'20'+m[3]:m[3]; var d=m[1], mo=m[2]; if(parseInt(mo,10)>12&&parseInt(d,10)<=12){var t=d; d=mo; mo=t;} return y+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0');}
  return '';
}
function si(v){v=norm(v); return v==='si'||v==='sí'||v==='true'||v==='1'||v==='x';}
async function hoja(nombre){
  var url='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(CFG.sheetId)+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(nombre);
  var r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('hoja '+nombre);
  var t=await r.text(); if(/^\s*</.test(t)) throw new Error('hoja '+nombre+' no pública');
  return parseCSV(t);
}
function insigniaURL(v){v=String(v||'').trim(); if(!v) return ''; if(/^https?:\/\//i.test(v)) return v; return v.replace(/^\/+/,'').replace(/^insignias\//,'');}
async function desdePlanilla(){
  var res=await Promise.all([hoja('Acciones'),hoja('Participaciones'),hoja('Config').catch(function(){return [];})]);
  var acc=res[0], part=res[1], conf=res[2];
  var acciones=acc.filter(function(a){return a.accion||a.nombre;}).map(function(a,i){
    var nombre=a.accion||a.nombre; var fecha=fechaISO(a.fecha); var est=norm(a.estado);
    return {id:'a'+i, key:norm(nombre), nombre:nombre, fecha:fecha, lugar:a.sede||a.lugar||'', descripcion:a.descripcion||'', img:insigniaURL(a.insignia),
      realizada: est? (est.indexOf('realiz')===0) : !!(fecha&&fecha<=hoy())};
  });
  var porNombre={}, cols=[], parts=[], vistos={};
  part.forEach(function(p){
    var nom=(p.nombre||p.colaborador||'').trim(); var an=norm(p.accion); if(!nom||!an) return;
    var a=acciones.find(function(x){return x.key===an;}); if(!a) return;
    var k=norm(nom), c=porNombre[k];
    if(!c){c={id:'c'+cols.length, nombre:nom, empresa:p.empresa||'', sede:p.sede||''}; porNombre[k]=c; cols.push(c);}
    if(!c.empresa&&p.empresa) c.empresa=p.empresa; if(!c.sede&&p.sede) c.sede=p.sede;
    var pk=a.id+'|'+c.id; if(vistos[pk]) return; vistos[pk]=1; parts.push({a:a.id,c:c.id});
  });
  var cfg={}; conf.forEach(function(r){var k=norm(r.clave||r.campo||Object.values(r)[0]); var v=r.valor||Object.values(r)[1]; if(k) cfg[k]=v;});
  return {acciones:acciones, colaboradores:cols, participaciones:parts, mostrarRanking: si(cfg['mostrar_ranking']||cfg['mostrar ranking'])};
}

/* ---------- Cálculos ---------- */
function realizada(a){return !!a.realizada;}
function accionesOrd(){return S.acciones.slice().sort(function(a,b){return (a.fecha||'9999').localeCompare(b.fecha||'9999');});}
function colorDe(a){var i=accionesOrd().findIndex(function(x){return x.id===a.id;}); return COLORES[(i<0?0:i)%COLORES.length];}
function org(c){var p=[c.empresa,c.sede].filter(Boolean); return p.length? p.map(esc).join(' · ') : '';}
function cara(a,size){return a.img? '<img src="'+esc(a.img)+'" alt="" loading="lazy">' : icono('estrella',size,'#fff');}
function fondo(a){return a.img? '#FFFFFF' : colorDe(a);}
function insigniasDe(cid){return S.participaciones.filter(function(p){return p.c===cid;}).map(function(p){return p.a;});}
function participantes(aid){return S.participaciones.filter(function(p){return p.a===aid;}).length;}
function ranking(){return S.colaboradores.map(function(c){return {c:c, ins:insigniasDe(c.id)};}).sort(function(x,y){return y.ins.length-x.ins.length || x.c.nombre.localeCompare(y.c.nombre,'es');});}

/* ---------- Secciones ---------- */
function renderHero(){
  var r=ranking().filter(function(x){return x.ins.length>0;});
  var hechas=S.acciones.filter(realizada).length;
  var pods=[1,0,2].map(function(i){
    var x=r[i], cls='pod'+(i===0?' p1':''), lab=['1.º lugar','2.º lugar','3.º lugar'][i];
    if(!x) return '<div class="'+cls+' vacio"><span class="pos">'+lab+'</span><span class="nm">Lugar disponible</span><span class="em">Sumá acciones para aparecer acá</span></div>';
    return '<div class="'+cls+'"><span class="pos">'+lab+'</span><span class="nm">'+esc(x.c.nombre)+'</span><span class="em">'+(org(x.c)||'&nbsp;')+'</span><span class="cnt"><b>'+x.ins.length+'</b> '+(x.ins.length===1?'insignia':'insignias')+'</span></div>';
  }).join('');
  return '<header class="hero"><div class="wrap">'+
   '<div class="top"><div class="hero-txt"><p class="eyebrow">Clusterciar en Acción · Agentes de Cambio</p><h1>Cada acción<br>deja una <b>huella.</b></h1>'+
   '<p class="lead">Participá de las acciones solidarias, ganá la insignia de cada una y coleccionalas todas. <b>El agente con más insignias se lleva un premio.</b></p>'+
   '<p class="cta"><span class="cta-btn">'+icono('manos',20,'currentColor')+'Anotate en la próxima acción desde Comunidad</span></p></div></div>'+
   '<div class="stats"><div class="stat"><div class="n">'+r.length+'</div><div class="l">agentes de cambio ya dejaron su huella</div></div>'+
   '<div class="stat"><div class="n">'+hechas+'</div><div class="l">'+(hechas===1?'acción realizada':'acciones realizadas')+' en equipo</div></div>'+
   '<div class="stat"><div class="n">'+S.participaciones.length+'</div><div class="l">insignias entregadas</div></div></div>'+
   (S.mostrarRanking? '<div class="podio" aria-label="Podio del ranking">'+pods+'</div>' : '')+
  '</div></header>';
}
function renderAlbum(){
  var acc=accionesOrd(), prox=acc.filter(function(a){return !realizada(a);})[0];
  var cards=acc.map(function(a){
    var n=participantes(a.id), esProx=prox&&prox.id===a.id;
    return '<article class="ins'+(realizada(a)?'':' futura')+'"><div class="ins-img" style="background:'+(a.img?'#FFFFFF':colorDe(a))+'">'+(a.img?'<img src="'+esc(a.img)+'" alt="Insignia '+esc(a.nombre)+'">':icono('estrella',48,'#fff'))+'</div>'+
      '<div class="ins-txt"><span class="pill'+(esProx?' prox':'')+'">'+(esProx?'Próxima acción':(realizada(a)?'Realizada':'Programada'))+'</span><h3>'+esc(a.nombre)+'</h3><p class="meta">'+esc(fFecha(a.fecha))+(a.lugar?' · '+esc(a.lugar):'')+'</p>'+(a.descripcion?'<p class="desc">'+esc(a.descripcion)+'</p>':'')+
      '<p class="ins-n"><b>'+n+'</b> '+(realizada(a)?(n===1?'agente la tiene':'agentes la tienen'):(n===1?'agente anotado':'agentes anotados'))+'</p></div></article>';
  });
  cards.push('<article class="ins oculta"><div class="ins-img"><span class="q" aria-hidden="true">?</span></div><div class="ins-txt"><span class="pill">Muy pronto</span><h3>Insignia sorpresa</h3><p class="desc">Una nueva acción está en camino. Estate atento a Comunidad para ser de los primeros en anotarte.</p></div></article>');
  return '<section class="album" aria-labelledby="h-album"><div class="sec-head"><p class="eyebrow2">Colección</p><h2 id="h-album">Coleccioná todas las insignias</h2><p class="sub">Cada acción tiene su pin único. Participás, lo ganás y queda en tu colección para siempre.</p></div><div class="album-grid">'+cards.join('')+'</div></section>';
}
function renderAgentes(){
  var acc=accionesOrd(), rev=S.mostrarRanking, r=ranking();
  if(!rev) r.sort(function(x,y){return x.c.nombre.localeCompare(y.c.nombre,'es');});
  var q=norm(filtro.q);
  var lista=r.map(function(x,i){x.pos=i+1; return x;}).filter(function(x){return (!q||norm(x.c.nombre).indexOf(q)>=0)&&(!filtro.empresa||x.c.empresa===filtro.empresa)&&(!filtro.sede||x.c.sede===filtro.sede);});
  var filas=lista.length? lista.map(function(x){
    var b=acc.map(function(a){var on=x.ins.indexOf(a.id)>=0; return '<span class="badge'+(on?'':' off')+'" style="background:'+fondo(a)+'" title="'+esc(a.nombre)+(on?' · conseguida':' · pendiente')+'" role="img" aria-label="'+esc(a.nombre)+(on?': conseguida':': pendiente')+'">'+cara(a,16)+'</span>';}).join('');
    var o=org(x.c);
    return '<div class="fila'+(rev?'':' sinrk')+'">'+(rev?'<span class="rk">'+(x.ins.length?x.pos:'–')+'</span>':'')+'<div style="min-width:0"><div class="nm2">'+esc(x.c.nombre)+'</div>'+(o?'<div class="meta">'+o+'</div>':'')+'<div class="badges">'+b+'</div></div><div class="total"><b>'+x.ins.length+'</b><span>'+(x.ins.length===1?'insignia':'insignias')+'</span></div></div>';
  }).join('') : '<div class="vacio-msg">'+(S.colaboradores.length?'Ningún agente coincide con la búsqueda.':'Todavía no hay agentes cargados.')+'</div>';
  return '<section aria-labelledby="h-agentes"><h2 id="h-agentes">'+(rev?'Ranking de agentes':'Muro de Agentes de Cambio')+'</h2><p class="sub">'+(rev?'Cada círculo es una insignia: una por cada acción en la que participaste.':'Ellos ya dejaron su huella. Cada círculo es una insignia ganada. ¿Te sumás a la lista?')+'</p>'+
   '<div class="filtros"><input id="f-q" type="search" placeholder="Buscá tu nombre" aria-label="Buscar por nombre" value="'+esc(filtro.q)+'">'+
   '<select id="f-emp" aria-label="Filtrar por empresa"><option value="">Todas las empresas</option>'+EMPRESAS.map(function(e){return '<option'+(filtro.empresa===e?' selected':'')+'>'+esc(e)+'</option>';}).join('')+'</select>'+
   '<select id="f-sede" aria-label="Filtrar por sede"><option value="">Todas las sedes</option>'+SEDES.map(function(e){return '<option'+(filtro.sede===e?' selected':'')+'>'+esc(e)+'</option>';}).join('')+'</select></div>'+
   '<div class="panel">'+filas+'</div></section>';
}
function renderComo(){
  var pasos=[['Enterate','Cada nueva acción se publica en <b>Comunidad</b>. Ahí ves la fecha, la sede y cómo anotarte.'],['Participá','Sumate a la acción con tus compañeros y poné tu granito de arena en la comunidad.'],['Ganá tu insignia','Recibís el pin de esa acción y tu nombre suma una insignia en este tablero.']];
  return '<section aria-labelledby="h-como"><p class="eyebrow2">Cómo sumarte</p><h2 id="h-como">Tres pasos para ser Agente de Cambio</h2><ol class="pasos">'+pasos.map(function(p){return '<li><div><b>'+p[0]+'</b><p>'+p[1]+'</p></div></li>';}).join('')+'</ol>'+
   '<div class="sumate">'+icono('estrella',28,'#fff')+'<p><b>Más acciones, más insignias, más chances de ganar.</b> Invitá a tu equipo: cada persona que se suma multiplica la huella que dejamos juntos.</p></div></section>';
}
function render(){
  var app=document.getElementById('app'), foco=document.activeElement&&document.activeElement.id, sel=null;
  try{ if(foco==='f-q') sel=document.activeElement.selectionStart; }catch(e){}
  app.innerHTML=renderHero()+'<main><div class="wrap">'+renderAlbum()+renderAgentes()+renderComo()+'</div></main>'+
   '<footer><div class="wrap">Clusterciar en Acción · Dejando huella positiva en nuestra comunidad. Las insignias se actualizan después de cada acción.</div></footer>';
  if(foco){var el=document.getElementById(foco); if(el){el.focus(); if(sel!=null){try{el.setSelectionRange(sel,sel);}catch(e){}}}}
}
document.addEventListener('input',function(e){if(e.target.id==='f-q'){filtro.q=e.target.value; render();}});
document.addEventListener('change',function(e){if(e.target.id==='f-emp'){filtro.empresa=e.target.value; render();} if(e.target.id==='f-sede'){filtro.sede=e.target.value; render();}});

(async function(){
  S=RESPALDO;
  if(CFG.sheetId){
    try{ S=await desdePlanilla(); origen='planilla'; }
    catch(e){ console.warn('No se pudo leer la planilla, se muestran los datos de respaldo.', e); }
  }
  render();
})();
})();
</script>
